<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Affiliate Program</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .join-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .join-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .join-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .join-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
            transform: translateX(-3px);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }

        .join-content {
            padding: 40px 30px;
        }

        .section-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .oauth-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            color: #333;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
        }

        .oauth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .oauth-button svg {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        .oauth-button.google {
            border-color: #db4437;
        }

        .oauth-button.google:hover {
            background: #db4437;
            color: white;
            border-color: #db4437;
        }

        .oauth-button.microsoft {
            border-color: #00a4ef;
        }

        .oauth-button.microsoft:hover {
            background: #00a4ef;
            color: white;
            border-color: #00a4ef;
        }

        .oauth-button.facebook {
            border-color: #1877f2;
        }

        .oauth-button.facebook:hover {
            background: #1877f2;
            color: white;
            border-color: #1877f2;
        }

        .oauth-button.linkedin {
            border-color: #0077b5;
        }

        .oauth-button.linkedin:hover {
            background: #0077b5;
            color: white;
            border-color: #0077b5;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        .checkbox-group a {
            color: #667eea;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.95rem;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .join-header h1 {
                font-size: 1.6rem;
            }

            .join-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="join-container">
        <a href="index.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>
        <div class="join-header">
            <h1>Join Our Affiliate Program</h1>
            <p>Start earning commissions today</p>
        </div>

        <div class="join-content">
            <div id="successMessage" class="success-message">
                ✓ Registration successful! Redirecting to dashboard...
            </div>

            <p class="section-title">Sign up with OAuth 2.0</p>

            <div class="oauth-buttons">
                <button class="oauth-button google" onclick="handleOAuth('Google')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="oauth-button microsoft" onclick="handleOAuth('Microsoft')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#f25022" d="M1 1h10v10H1z"/>
                        <path fill="#00a4ef" d="M13 1h10v10H13z"/>
                        <path fill="#7fba00" d="M1 13h10v10H1z"/>
                        <path fill="#ffb900" d="M13 13h10v10H13z"/>
                    </svg>
                    Continue with Microsoft
                </button>

                <button class="oauth-button facebook" onclick="handleOAuth('Facebook')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#1877f2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    Continue with Facebook
                </button>

                <button class="oauth-button linkedin" onclick="handleOAuth('LinkedIn')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#0077b5" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                    Continue with LinkedIn
                </button>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <form id="signupForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a strong password" minlength="8">
                </div>

                <div class="form-group">
                    <label for="website">Website/Platform (Optional)</label>
                    <input type="url" id="website" name="website" placeholder="https://yourwebsite.com">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="#" onclick="alert('Terms & Conditions would open here'); return false;">Terms & Conditions</a> and <a href="#" onclick="alert('Privacy Policy would open here'); return false;">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="submit-button">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="#" onclick="alert('Login page would open here'); return false;">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function handleOAuth(provider) {
            // Mockup OAuth flow
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = `✓ Authenticating with ${provider}...`;
            successMsg.style.display = 'block';
            
            setTimeout(() => {
                successMsg.textContent = `✓ Successfully authenticated with ${provider}! Redirecting to dashboard...`;
                
                setTimeout(() => {
                    alert(`OAuth 2.0 Mockup:\n\nYou would be redirected to ${provider}'s authorization page.\n\nAfter authorization, you'd be redirected back with an access token.\n\nIn a real implementation, this would:\n1. Redirect to ${provider} OAuth endpoint\n2. User grants permissions\n3. Receive authorization code\n4. Exchange code for access token\n5. Retrieve user profile\n6. Create affiliate account\n7. Redirect to dashboard`);
                    successMsg.style.display = 'none';
                }, 1500);
            }, 1000);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);
            
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = '✓ Creating your account...';
            successMsg.style.display = 'block';
            
            setTimeout(() => {
                successMsg.textContent = '✓ Registration successful! Redirecting to dashboard...';
                
                setTimeout(() => {
                    alert(`Account Created!\n\nName: ${data.name}\nEmail: ${data.email}\nWebsite: ${data.website || 'Not provided'}\n\nIn a real implementation, this would:\n1. Validate form data\n2. Create user account in database\n3. Send verification email\n4. Log user in\n5. Redirect to affiliate dashboard`);
                    event.target.reset();
                    successMsg.style.display = 'none';
                }, 1500);
            }, 1000);
        }
    </script>
</body>
</html>
